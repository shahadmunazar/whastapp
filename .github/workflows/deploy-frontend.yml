name: Deploy Frontend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**' # Only trigger if files in the frontend folder changed
      - '.github/workflows/deploy-frontend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FRONTEND_EC2_HOST }}
          username: ${{ secrets.FRONTEND_EC2_USERNAME }}
          key: ${{ secrets.FRONTEND_EC2_SSH_KEY }}
          # IMPORTANT: Update the target directory `~/whastapp/frontend` if your project is located elsewhere on the server.
          script: |
            cd ~/whastapp/frontend
            git pull origin main
            npm install
            npm run build
            
            # If you serve your frontend using pm2, uncomment the line below:
            # pm2 restart frontend
            
            # If you serve using nginx or apache, you might need to copy the build files to the web root:
            # sudo cp -r dist/* /var/www/html/
