name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**' # Only trigger if files in the backend folder changed
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # IMPORTANT: Update the target directory `~/whastapp` if your project is located elsewhere on the server.
          # Update the restart command `pm2 restart backend` if you use a different pm2 name or systemd.
          script: |
            cd ~/whastapp/backend
            git pull origin main
            npm install
            npm run migrate
            pm2 restart whatsapp-backend
